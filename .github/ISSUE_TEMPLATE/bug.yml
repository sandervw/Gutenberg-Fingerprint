name: Bug report
description: A page is broken, or a number looks wrong.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://gufime.com/works/...
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Windows 11
