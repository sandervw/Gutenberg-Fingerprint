name: Nightly pipeline

# Orchestrates from Actions; every step executes over ssh on the box.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

env:
  BOX: gufime@15.204.82.199
  SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i /home/runner/.ssh/gufime_key

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Install box SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GUFIME_SSH_KEY }}" | tr -d '\r' > ~/.ssh/gufime_key
          chmod 600 ~/.ssh/gufime_key

      - name: Sync code on the box
        run: ssh $SSH_OPTS $BOX "cd /code/gufime && git fetch origin && git checkout main && git reset --hard origin/main"

      - name: Catalog ingest (CDC gate)
        id: catalog
        run: |
          output=$(ssh $SSH_OPTS $BOX "cd /code/gufime && GUFIME_TARGET=postgres ~/.local/bin/uv run python -m python.workflow.catalog_ingest")
          echo "$output"
          echo "$output" | grep '^new_count=' >> "$GITHUB_OUTPUT"

      - name: Text ingest
        if: steps.catalog.outputs.new_count != '0'
        run: ssh $SSH_OPTS $BOX "cd /code/gufime && GUFIME_TARGET=postgres ~/.local/bin/uv run python -m python.workflow.text_ingest"

      - name: Strip
        if: steps.catalog.outputs.new_count != '0'
        run: ssh $SSH_OPTS $BOX "cd /code/gufime && GUFIME_TARGET=postgres ~/.local/bin/uv run python -m python.workflow.strip"

      - name: Measure
        if: steps.catalog.outputs.new_count != '0'
        run: ssh $SSH_OPTS $BOX "cd /code/gufime && GUFIME_TARGET=postgres ~/.local/bin/uv run python -m python.workflow.measure"

      - name: dbt deps
        if: steps.catalog.outputs.new_count != '0'
        run: ssh $SSH_OPTS $BOX "cd /code/gufime/dbt && ~/.local/bin/uv run dbt deps"

      - name: dbt build
        if: steps.catalog.outputs.new_count != '0'
        run: ssh $SSH_OPTS $BOX "cd /code/gufime/dbt && ~/.local/bin/uv run dbt build --target postgres"

      - name: Evidence build
        if: steps.catalog.outputs.new_count != '0'
        run: ssh $SSH_OPTS $BOX "cd /code/gufime/evidence && npm run sources && npm run build"

      - name: Deploy to Cloudflare Pages
        if: steps.catalog.outputs.new_count != '0'
        run: ssh $SSH_OPTS $BOX "cd /code/gufime/evidence && CLOUDFLARE_API_TOKEN=\$(cat ~/.config/gufime/cf_token) wrangler pages deploy build --project-name=gutenberg-fingerprint --branch=main"

      - name: Backup corpus to R2
        if: steps.catalog.outputs.new_count != '0'
        run: ssh $SSH_OPTS $BOX "cd /code/gufime && GUFIME_TARGET=postgres CLOUDFLARE_API_TOKEN=\$(cat ~/.config/gufime/cf_token) ~/.local/bin/uv run python -m python.workflow.backup corpus"

      - name: Backup Postgres to R2
        run: ssh $SSH_OPTS $BOX "cd /code/gufime && GUFIME_TARGET=postgres CLOUDFLARE_API_TOKEN=\$(cat ~/.config/gufime/cf_token) ~/.local/bin/uv run python -m python.workflow.backup pg"
