version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # dbt-core 2 is a rewrite; stay on 1.x.
      - dependency-name: dbt-core
        versions: [">= 2"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
