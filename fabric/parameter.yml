# fabric-cicd parameterization for the gutenberg-fingerprint workspace.
#
# Every GUID baked into an exported item definition is listed here, so a deploy
# can retarget a different workspace without hand-editing any definition file.
# Deploying back into the workspace these were exported from resolves each
# variable to the value already in the file, i.e. a no-op.
#
# Dynamic variables (item type and name are CASE-SENSITIVE, attributes lowercase):
#   $workspace.$id                          id of the target workspace
#   $items.<Type>.<Name>.$id                id of an item in fabric/, after publish
#   $items.Lakehouse.<Name>.$sqlendpointid  that lakehouse's SQL analytics endpoint
#   $workspace.<ws>.$items.<Type>.<Name>.$… an item that is NOT in fabric/

find_replace:
  # --- workspace ------------------------------------------------------------
  # Appears in every notebook's lakehouse binding and in every pipeline activity.
  - find_value: "bfad3948-6e3b-4eeb-8ee1-485e0f47c87b"
    replace_value:
      _ALL_: "$workspace.$id"

  # --- lakehouses -----------------------------------------------------------
  # Default-lakehouse binding in the ipynb metadata. All ten notebooks use
  # lh_bronze; without this the deployed notebook stays bound to the source
  # workspace's lakehouse and /lakehouse/default/ mounts the wrong data.
  - find_value: "1cebda9c-5c4f-47bb-a82a-4820a7fdf71f"
    replace_value:
      _ALL_: "$items.Lakehouse.lh_bronze.$id"

  # The refresh_silver activity targets lh_silver's SQL analytics endpoint.
  # Fabric creates that endpoint alongside the lakehouse and it is not a
  # deployable item, so it is resolved off the lakehouse instead.
  - find_value: "3c6b2462-5111-4bf8-bf3b-4a6cfa077fd0"
    replace_value:
      _ALL_: "$items.Lakehouse.lh_silver.$sqlendpointid"
    item_type: "DataPipeline"

  # --- pipeline -> notebook and dbt job references --------------------------
  # pl_nightly references its children by item id. `fab export` writes an
  # all-zero logicalId into every .platform, so fabric-cicd's auto-binding has
  # nothing to match on and each reference has to be replaced explicitly.
  - find_value: "f5953ae6-151e-45fc-92fd-7d76b159b0d8"
    replace_value:
      _ALL_: "$items.Notebook.nb_catalog_ingest.$id"
    item_type: "DataPipeline"

  - find_value: "27310512-a584-4d4d-bd1c-d3040a86d524"
    replace_value:
      _ALL_: "$items.Notebook.nb_filter.$id"
    item_type: "DataPipeline"

  - find_value: "613cfd4e-86e4-4916-afa0-01641307ce0c"
    replace_value:
      _ALL_: "$items.Notebook.nb_text_ingest.$id"
    item_type: "DataPipeline"

  - find_value: "c3b0a808-e91f-4982-aa5f-906c515b7bd8"
    replace_value:
      _ALL_: "$items.Notebook.nb_strip.$id"
    item_type: "DataPipeline"

  - find_value: "88e6e19b-997d-4b68-852a-b176200f030e"
    replace_value:
      _ALL_: "$items.Notebook.nb_measure.$id"
    item_type: "DataPipeline"

  - find_value: "6dc8f22d-dea9-4771-9530-5951b6395234"
    replace_value:
      _ALL_: "$items.Notebook.nb_export_gold.$id"
    item_type: "DataPipeline"

  - find_value: "e1283c6e-b1f7-43e5-ba92-a9ba99c336c3"
    replace_value:
      _ALL_: "$items.DataBuildToolJob.dbtJob_gutenberg.$id"
    item_type: "DataPipeline"

  # --- warehouse ------------------------------------------------------------
  # wh_gold is not in fabric/: getDefinition returns OperationNotSupportedForItem
  # for a Warehouse, and dbt owns its schema anyway. It is therefore resolved by
  # name out of the target workspace, which must already contain it.
  - find_value: "e062cb7f-a620-4265-a8bf-4a67cfb5440e"
    replace_value:
      PROD: "$workspace.gutenberg-fingerprint.$items.Warehouse.wh_gold.$id"
    item_type: "DataBuildToolJob"

  - find_value: "fr7xv35iil4ehegy7wuqkoukpi-ja423pz3n3vu5dxbjbpa6r6ipm.datawarehouse.fabric.microsoft.com"
    replace_value:
      PROD: "$workspace.gutenberg-fingerprint.$items.Warehouse.wh_gold.$sqlendpoint"
    item_type: "DataBuildToolJob"

  # --- connections ----------------------------------------------------------
  # Connections live at tenant level, not in the workspace, so no variable can
  # resolve them. A second environment needs its own GUIDs pasted in below.
  - find_value: "5fa47b8b-233d-480b-8cd6-4720b4882b57" # dbt activity
    replace_value:
      PROD: "5fa47b8b-233d-480b-8cd6-4720b4882b57"
    item_type: "DataPipeline"

  - find_value: "e7aafe45-1197-4cb1-a033-df415503016a" # RefreshSqlEndpoint activity
    replace_value:
      PROD: "e7aafe45-1197-4cb1-a033-df415503016a"
    item_type: "DataPipeline"

  - find_value: "34ff73d5-37f3-475b-98e7-383775ba00ff" # GitHub, source of the dbt project
    replace_value:
      PROD: "34ff73d5-37f3-475b-98e7-383775ba00ff"
    item_type: "DataBuildToolJob"
