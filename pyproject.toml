[project]
name = "gutenberg-fingerprint"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.17",
    "dagster-postgres>=0.29.17",
    "dagster-webserver>=1.13.17",
    "dbt-core>=1.11.12,<2.0",
    "dbt-duckdb>=1.10.1",
    "dbt-postgres>=1.10.1",
]

[dependency-groups]
dev = [
    "deltalake>=1.6.2",
    "duckdb>=1.1.0",
    "en-core-web-sm",
    "polars>=1.42.1",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=25.0.0",
    "requests>=2.32.0",
    "spacy>=3.8.14",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.dagster]
module_name = "python.dagster.definitions"
code_location_name = "gufime"
