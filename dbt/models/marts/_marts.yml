version: 2

models:
  - name: dim_metric
    description: "One row per metric concept (15). Pass-through of seed_metrics + surrogate key."
    columns:
      - name: metric_key
        description: "Surrogate hash of metric_name. Facts join on this, not the free-text name."
        data_tests:
          - unique
          - not_null
      - name: additivity
        description: "Kimball additivity class. All 15 metrics are non-additive (ratios/averages/indices); value + zscore must never be summed across rows."
        data_tests:
          - accepted_values:
              arguments:
                values: ["additive", "semi-additive", "non-additive"]

  - name: dim_author
    description: "One row per author: catalog primary authors (stg_works.author_name) plus the self row off the seed."
    columns:
      - name: author_key
        description: "Surrogate hash of author name."
        data_tests:
          - unique # fails loudly if a catalog name collides with the seed self row
          - not_null

  - name: dim_work
    description: "One row per measured work: catalog works (stg_works) + self corpus (seed_authors). Unmeasured catalog rows are excluded."
    columns:
      - name: work_key
        description: "Surrogate hash of work_id."
        data_tests:
          - unique
          - not_null
      - name: ingested_at
        description: "When nb_measure last processed this work; re-measured works restamp."
        data_tests:
          - not_null
      - name: word_count
        description: "Alpha-token count off raw_measurements' word_count series."
        data_tests:
          - not_null
      - name: author_key
        description: "FK to dim_author."
        data_tests:
          - not_null
          - relationships: # every work's author must exist in dim_author
              arguments:
                to: ref('dim_author')
                field: author_key
      - name: genre
        description: "Sci-Fi / Fantasy / Undetermined, carried off stg_works. The self corpus is seeded as 'speculative fiction' and lands Undetermined, so the 26 self works never skew a genre split."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Sci-Fi", "Fantasy", "Undetermined"]
      - name: prose_type
        description: "Size band off word_count (<10k short-story, <40k novella, else novel)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["short-story", "novella", "novel"]

  - name: fact_style_measurement
    description: "Central fact: one row per work x metric series. Carries the raw value, FKs to dim_work, dim_author, and dim_metric. Z-scores computed in the marts."
    columns:
      - name: measurement_key
        description: "Surrogate hash of (work_id, metric_name). PK + grain guard."
        data_tests:
          - unique # fails if (work, series) ever duplicates -> grain broken
          - not_null
      - name: work_key
        description: "FK to dim_work."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_work')
                field: work_key
      - name: author_key
        description: "FK to dim_author, carried direct off dim_work for star-schema slicing."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_author')
                field: author_key
      - name: metric_key
        description: "FK to dim_metric (concept grain; one key spans a multivalue concept's child series)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_metric')
                field: metric_key

  - name: fact_vocab_overlap
    description: "Author-pair fact: you (author_key_a) vs each other author (author_key_b), with Jaccard vocabulary overlap. Jaccard reads 0 until the self corpus lands in the lakehouse."
    columns:
      - name: overlap_key
        description: "Surrogate hash of (author_key_a, author_key_b). PK + grain guard."
        data_tests:
          - unique
          - not_null
      - name: author_key_a
        description: "FK to dim_author -- you (the is_self side)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_author')
                field: author_key
      - name: author_key_b
        description: "FK to dim_author -- the other author. Unique = exactly one pair per other author."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_author')
                field: author_key
      - name: jaccard
        description: "|A∩B| / |A∪B|. A proper fraction, so must sit in [0, 1]."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

  - name: mart_work
    description: "Work-grain serving mart: dim_work attributes, author name, excess index."
    columns:
      - name: work_key
        description: "PK + grain guard (one row per measured work)."
        data_tests:
          - unique
          - not_null
      - name: author_key
        description: "FK to dim_author."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_author')
                field: author_key
      - name: excess
        description: "Distinctiveness index: summed z-score mass beyond +/-2."
        data_tests:
          - not_null
      - name: series_measured
        description: "Series measured for this work; guards silent partial loads."
        data_tests:
          - not_null

  - name: mart_author
    description: "Author-grain serving mart: work and word rollups over mart_work."
    columns:
      - name: author_key
        description: "PK + grain guard (one row per author with works)."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_author')
                field: author_key
      - name: works
        description: "Measured works held by this author."
        data_tests:
          - not_null
      - name: total_words
        description: "Summed word_count; null when any work is unmeasured."

  - name: mart_style_long
    description: "Measurement OBT at work x child series grain, with precomputed series_label."
    data_tests:
      - dbt_utils.unique_combination_of_columns: # grain = work x child series
          arguments:
            combination_of_columns:
              - work_key
              - metric_name
    columns:
      - name: work_key
        description: "FK to dim_work."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_work')
                field: work_key
      - name: author_key
        description: "FK to dim_author."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_author')
                field: author_key
      - name: metric_key
        description: "FK to dim_metric (concept grain)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_metric')
                field: metric_key
      - name: value
        description: "Raw measured value. Non-additive."
        data_tests:
          - not_null
